<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alumni Profile - AlumniNetwork</title>
  <meta name="description" content="View alumnus professional bio, educational journey, career milestones, and mentorship availability.">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/dark.css">
</head>
<body>
  <!-- Global Header -->
  <header id="app-header"></header>

  <main style="padding-bottom: 5rem;">
    <!-- Profile Banner & Main Info -->
    <div class="profile-header-container" style="background: linear-gradient(135deg, rgba(14, 165, 233, 0.25) 0%, rgba(3, 105, 161, 0.15) 100%); padding: 3rem 0 1rem; border-bottom: 1px solid var(--border-subtle);">
      <div class="container">
        <div style="display: flex; gap: 2rem; align-items: flex-end; flex-wrap: wrap;">
          <!-- Profile Avatar -->
          <div style="position: relative;">
            <img id="prof-photo" src="" alt="Profile Photo" style="width: 140px; height: 140px; border-radius: var(--radius-xl); object-fit: cover; border: 4px solid var(--bg-surface); box-shadow: var(--shadow-xl); background: var(--bg-muted);">
            <div id="prof-verified-badge" style="position: absolute; bottom: -8px; right: -8px; background: var(--color-primary); color: #fff; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.95rem; border: 3px solid var(--bg-surface); box-shadow: var(--shadow-md);" title="Verified Alumnus">
              ✓
            </div>
          </div>

          <!-- Basic Info -->
          <div style="flex: 1; min-width: 280px;">
            <div style="display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 0.25rem;">
              <h1 id="prof-name" style="font-size: 2.2rem; font-weight: 800; letter-spacing: -0.02em;">Loading Profile...</h1>
              <span id="prof-batch-badge" class="badge badge-primary" style="font-size: 0.85rem; padding: 0.35rem 0.8rem;">Class of 2015</span>
            </div>

            <div id="prof-role-company" style="font-size: 1.15rem; font-weight: 600; color: var(--color-primary); margin-bottom: 0.4rem;">
              Software Engineer at Tech
            </div>

            <div style="display: flex; gap: 1.25rem; font-size: 0.88rem; color: var(--text-muted); flex-wrap: wrap; margin-bottom: 0.75rem;">
              <span id="prof-branch">🎓 Computer Science</span>
              <span id="prof-location">📍 Bangalore</span>
              <span id="prof-email">✉️ email@domain.com</span>
            </div>

            <div id="prof-social-links" style="display: flex; gap: 0.6rem;">
              <!-- Populated by JS -->
            </div>
          </div>

          <!-- Profile Actions (Edit Profile if self or admin) -->
          <div id="prof-actions-container" style="display: flex; gap: 0.75rem; margin-bottom: 0.5rem;">
            <!-- Populated dynamically: Edit Profile button or Connect/Mentor buttons -->
          </div>
        </div>
      </div>
    </div>

    <!-- Profile Details & Content Tabs -->
    <div class="container" style="margin-top: 2.5rem;">
      <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 2.5rem;" class="profile-layout-grid">
        <!-- Main Column -->
        <div>
          <!-- Bio Card -->
          <div class="card" style="margin-bottom: 2rem;">
            <h3 style="font-size: 1.2rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
              <span>📝</span> Biography
            </h3>
            <p id="prof-bio" style="font-size: 0.98rem; color: var(--text-secondary); line-height: 1.7; white-space: pre-line;">
              Loading bio...
            </p>
          </div>

          <!-- Experience Card -->
          <div class="card" style="margin-bottom: 2rem;">
            <h3 style="font-size: 1.2rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
              <span>💼</span> Work & Career Journey
            </h3>
            <div id="prof-experience" style="font-size: 0.95rem; color: var(--text-secondary); line-height: 1.6;">
              Loading experience...
            </div>
          </div>

          <!-- Education Card -->
          <div class="card">
            <h3 style="font-size: 1.2rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
              <span>🎓</span> Alma Mater Education
            </h3>
            <div id="prof-education" style="font-size: 0.95rem; color: var(--text-secondary); line-height: 1.6;">
              Loading education...
            </div>
          </div>
        </div>

        <!-- Sidebar Column -->
        <div>
          <!-- Skills & Expertise Card -->
          <div class="card" style="margin-bottom: 2rem;">
            <h3 style="font-size: 1.15rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
              <span>⚡</span> Skills & Specialties
            </h3>
            <div id="prof-skills-container" style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
              <!-- Populated by JS -->
            </div>
          </div>

          <!-- Mentorship Status Card -->
          <div id="prof-mentorship-card" class="card" style="background: var(--bg-surface-elevated); border: 1.5px solid var(--border-subtle);">
            <h3 style="font-size: 1.15rem; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem;">
              <span>🤝</span> Mentorship
            </h3>
            <div id="prof-mentorship-content">
              <!-- Populated by JS -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Edit Profile Modal -->
    <div id="edit-profile-modal" class="modal-backdrop">
      <div class="modal-content" style="max-width: 650px;">
        <div class="modal-header">
          <h3 class="modal-title">✏️ Edit Profile</h3>
          <button class="modal-close" onclick="document.getElementById('edit-profile-modal').classList.remove('active')">✕</button>
        </div>
        <form id="edit-profile-form">
          <div class="modal-body">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
              <div class="form-group">
                <label class="form-label" for="edit-name">Full Name *</label>
                <input type="text" id="edit-name" class="form-control" required>
              </div>

              <div class="form-group">
                <label class="form-label" for="edit-email">Email Address *</label>
                <input type="email" id="edit-email" class="form-control" required>
              </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
              <div class="form-group">
                <label class="form-label" for="edit-profession">Profession / Title *</label>
                <select id="edit-profession" class="form-control form-select" required>
                  <option value="Software Engineer">Software Engineer</option>
                  <option value="Data Scientist">Data Scientist</option>
                  <option value="Entrepreneur">Entrepreneur</option>
                  <option value="Academician">Academician</option>
                  <option value="Healthcare Professional">Healthcare Professional</option>
                </select>
              </div>

              <div class="form-group">
                <label class="form-label" for="edit-company">Current Organization / Company *</label>
                <input type="text" id="edit-company" class="form-control" placeholder="e.g. Stripe, IISc" required>
              </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;">
              <div class="form-group">
                <label class="form-label" for="edit-batch">Graduation Year *</label>
                <input type="text" id="edit-batch" class="form-control" placeholder="e.g. 2018" required>
              </div>

              <div class="form-group">
                <label class="form-label" for="edit-branch">Branch *</label>
                <select id="edit-branch" class="form-control form-select" required>
                  <option value="Computer Science">Computer Science</option>
                  <option value="Information Technology">Information Technology</option>
                  <option value="Electronics & Communication">Electronics & Comm</option>
                  <option value="Mechanical Engineering">Mechanical</option>
                  <option value="Civil Engineering">Civil</option>
                  <option value="Biotechnology">Biotechnology</option>
                  <option value="Electrical & Electronics">Electrical</option>
                  <option value="Chemical Engineering">Chemical</option>
                  <option value="Industrial Engineering">Industrial</option>
                </select>
              </div>

              <div class="form-group">
                <label class="form-label" for="edit-location">Location *</label>
                <select id="edit-location" class="form-control form-select" required>
                  <option value="Bangalore">Bangalore</option>
                  <option value="Chennai">Chennai</option>
                  <option value="Mumbai">Mumbai</option>
                  <option value="Delhi">Delhi</option>
                  <option value="Hyderabad">Hyderabad</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="edit-photo">Avatar Photo URL</label>
              <input type="url" id="edit-photo" class="form-control" placeholder="https://images.unsplash.com/...">
            </div>

            <div class="form-group">
              <label class="form-label" for="edit-bio">Biography *</label>
              <textarea id="edit-bio" class="form-control" rows="3" placeholder="Tell fellow alumni about your professional focus and passions..." required></textarea>
            </div>

            <div class="form-group">
              <label class="form-label" for="edit-skills">Skills (Comma-separated) *</label>
              <input type="text" id="edit-skills" class="form-control" placeholder="Go, Distributed Systems, System Design, Kafka" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="edit-experience">Career Experience Summary</label>
              <textarea id="edit-experience" class="form-control" rows="2" placeholder="Key roles held, companies, and achievements"></textarea>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
              <div class="form-group">
                <label class="form-label" for="edit-linkedin">LinkedIn Profile URL</label>
                <input type="url" id="edit-linkedin" class="form-control" placeholder="https://linkedin.com/in/username">
              </div>

              <div class="form-group">
                <label class="form-label" for="edit-github">GitHub or Portfolio URL</label>
                <input type="url" id="edit-github" class="form-control" placeholder="https://github.com/username">
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline" onclick="document.getElementById('edit-profile-modal').classList.remove('active')">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Profile Changes</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer id="app-footer"></footer>

  <script type="module" src="../js/storage.js"></script>
  <script type="module" src="../js/auth.js"></script>
  <script type="module" src="../js/ui.js"></script>
  <script type="module" src="../js/profile.js"></script>
</body>
</html>
