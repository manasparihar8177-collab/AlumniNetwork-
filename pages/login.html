<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - AlumniNetwork</title>
  <meta name="description" content="Sign in to AlumniNetwork. Fast simulated authentication with pre-configured demo roles for students, alumni, and administrators.">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/dark.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">
  <header id="app-header"></header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem;">
    <div class="card" style="width: 100%; max-width: 480px; padding: 2.5rem; box-shadow: var(--shadow-xl);">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div class="brand-icon" style="width: 48px; height: 48px; margin: 0 auto 0.75rem; font-size: 1.5rem; background: linear-gradient(135deg, var(--color-primary), #0284C7); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; color: #fff;">
          🎓
        </div>
        <h1 style="font-size: 1.75rem; font-weight: 800; margin-bottom: 0.35rem;">Welcome Back</h1>
        <p style="font-size: 0.9rem; color: var(--text-muted);">
          Sign in to access your alumni profile, reunions, and mentorship
        </p>
      </div>

      <!-- Quick Demo Login Presets (Great for testers!) -->
      <div style="background: var(--bg-muted); border-radius: var(--radius-lg); padding: 1rem; margin-bottom: 1.75rem;">
        <div style="font-size: 0.78rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.5rem; text-align: center;">
          ⚡ 1-Click Fast Demo Login
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem;">
          <button type="button" class="btn btn-outline btn-sm demo-login-btn" data-role="student" style="font-size: 0.75rem;">
            🎓 Student
          </button>
          <button type="button" class="btn btn-outline btn-sm demo-login-btn" data-role="alumni" style="font-size: 0.75rem; background: var(--color-primary-light); color: var(--color-primary-dark); font-weight: 700;">
            💼 Alumni
          </button>
          <button type="button" class="btn btn-outline btn-sm demo-login-btn" data-role="admin" style="font-size: 0.75rem; color: var(--color-danger);">
            ⚙️ Admin
          </button>
        </div>
      </div>

      <!-- Standard Form -->
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-control" value="priya.alumni@tech.com" placeholder="name@alumni.edu" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="form-control" value="••••••••" placeholder="Enter password" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-role">Persona Role</label>
          <select id="login-role" class="form-control form-select">
            <option value="alumni">Alumni Member</option>
            <option value="student">Student / Undergrad</option>
            <option value="admin">University Admin</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1rem;">
          Sign In
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.88rem; color: var(--text-secondary);">
        Don't have an alumni account yet? <a href="register.html" style="font-weight: 700;">Register Here</a>
      </div>
    </div>
  </main>

  <footer id="app-footer"></footer>

  <script type="module" src="../js/storage.js"></script>
  <script type="module" src="../js/auth.js"></script>
  <script type="module" src="../js/ui.js"></script>
  <script type="module" src="../js/auth-pages.js"></script>
</body>
</html>
